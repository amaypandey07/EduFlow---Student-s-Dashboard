<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance · EduFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/attendance.css" />
</head>
<body>

  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">E</div>
        <span class="sidebar-brand-name">EduFlow</span>
      </div>

      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link" data-page="index.html">
          <i class="fa-solid fa-grip"></i><span>Dashboard</span>
        </a>
        <a href="academics.html" class="sidebar-link" data-page="academics.html">
          <i class="fa-solid fa-book-open"></i><span>Academics</span>
        </a>
        <a href="attendance.html" class="sidebar-link" data-page="attendance.html">
          <i class="fa-solid fa-calendar-check"></i><span>Attendance</span>
        </a>
        <a href="assignments.html" class="sidebar-link" data-page="assignments.html">
          <i class="fa-solid fa-list-check"></i><span>Assignments</span>
        </a>
        <a href="timetable.html" class="sidebar-link" data-page="timetable.html">
          <i class="fa-solid fa-table-cells"></i><span>Timetable</span>
        </a>
        <a href="profile.html" class="sidebar-link" data-page="profile.html">
          <i class="fa-solid fa-user"></i><span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Collapse sidebar">
          <i class="fa-solid fa-angles-left"></i>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" data-mobile-overlay></div>

    <div>
      <header class="header">
        <div style="display:flex; align-items:center; gap: var(--space-4);">
          <button class="mobile-menu-btn icon-btn" data-mobile-menu aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-greeting">
            <h1>Attendance</h1>
            <p>Track your subject-wise attendance.</p>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">
            <i class="fa-solid fa-moon"></i>
          </button>
          <div class="avatar" title="Amay Verma">AV</div>
        </div>
      </header>

      <main class="main-content">

        <!-- Overall attendance summary -->
        <section class="card" style="margin-bottom: var(--space-6);">
          <div class="overall-attendance">
            <div>
              <div class="overall-attendance-value" id="overall-value">0%</div>
              <div class="overall-attendance-label">Overall Attendance</div>
            </div>
            <div class="overall-attendance-bar">
              <div class="progress-track" style="height: 14px;">
                <div class="progress-fill" id="overall-fill" data-fill="0"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- Subject-wise attendance -->
        <section class="card">
          <div class="card-header">
            <span class="card-title">Subject-wise Attendance</span>
          </div>
          <div id="attendance-list"></div>
        </section>

      </main>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/attendance.js"></script>
</body>
</html>
