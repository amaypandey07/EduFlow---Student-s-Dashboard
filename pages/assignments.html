<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignments · EduFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/assignments.css" />
</head>
<body>

  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">E</div>
        <span class="sidebar-brand-name">EduFlow</span>
      </div>

      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link" data-page="index.html">
          <i class="fa-solid fa-grip"></i><span>Dashboard</span>
        </a>
        <a href="academics.html" class="sidebar-link" data-page="academics.html">
          <i class="fa-solid fa-book-open"></i><span>Academics</span>
        </a>
        <a href="attendance.html" class="sidebar-link" data-page="attendance.html">
          <i class="fa-solid fa-calendar-check"></i><span>Attendance</span>
        </a>
        <a href="assignments.html" class="sidebar-link" data-page="assignments.html">
          <i class="fa-solid fa-list-check"></i><span>Assignments</span>
        </a>
        <a href="timetable.html" class="sidebar-link" data-page="timetable.html">
          <i class="fa-solid fa-table-cells"></i><span>Timetable</span>
        </a>
        <a href="profile.html" class="sidebar-link" data-page="profile.html">
          <i class="fa-solid fa-user"></i><span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Collapse sidebar">
          <i class="fa-solid fa-angles-left"></i>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" data-mobile-overlay></div>

    <div>
      <header class="header">
        <div style="display:flex; align-items:center; gap: var(--space-4);">
          <button class="mobile-menu-btn icon-btn" data-mobile-menu aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-greeting">
            <h1>Assignments</h1>
            <p>Manage your pending and completed work.</p>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">
            <i class="fa-solid fa-moon"></i>
          </button>
          <div class="avatar" title="Amay Verma">AV</div>
        </div>
      </header>

      <main class="main-content">

        <!-- Toolbar: search + filters + add button -->
        <div class="assignments-toolbar">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search assignments..." class="form-input" />
          </div>

          <select id="status-filter" class="form-select">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>

          <select id="priority-filter" class="form-select">
            <option value="all">All Priority</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>

          <button class="btn btn-primary" id="add-assignment-btn">
            <i class="fa-solid fa-plus"></i> Add Assignment
          </button>
        </div>

        <!-- Assignment cards render here via JS -->
        <div id="assignments-list" class="assignments-grid"></div>

      </main>
    </div>
  </div>

  <!-- ============ ADD/EDIT MODAL ============ -->
  <div class="modal-overlay" id="assignment-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="assignment-modal-title">Add Assignment</span>
        <button class="modal-close" id="assignment-modal-close" aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="assignment-form">
        <div class="form-group">
          <label class="form-label" for="title">Title</label>
          <input type="text" id="title" name="title" class="form-input" placeholder="e.g. ER Diagram Assignment" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="subject">Subject</label>
          <select id="subject" name="subject" class="form-select" required>
            <option value="Data Structures">Data Structures</option>
            <option value="DBMS">DBMS</option>
            <option value="Operating Systems">Operating Systems</option>
            <option value="Computer Networks">Computer Networks</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Software Engineering">Software Engineering</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="dueDate">Due Date</label>
          <input type="date" id="dueDate" name="dueDate" class="form-input" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="priority">Priority</label>
          <select id="priority" name="priority" class="form-select" required>
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>

        <div style="display:flex; gap: var(--space-3); margin-top: var(--space-6);">
          <button type="submit" class="btn btn-primary" style="flex:1;">Save Assignment</button>
          <button type="button" class="btn btn-secondary" id="assignment-modal-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/notifications.js"></script>
  <script src="../js/assignments.js"></script>
</body>
</html>
