<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timetable · EduFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/interactions.css" />
  <link rel="stylesheet" href="../css/timetable.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <div class="app-shell">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">E</div>
        <span class="sidebar-brand-name">EduFlow</span>
      </div>

      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link" data-page="index.html">
          <i class="fa-solid fa-grip"></i><span>Dashboard</span>
        </a>
        <a href="academics.html" class="sidebar-link" data-page="academics.html">
          <i class="fa-solid fa-book-open"></i><span>Academics</span>
        </a>
        <a href="attendance.html" class="sidebar-link" data-page="attendance.html">
          <i class="fa-solid fa-calendar-check"></i><span>Attendance</span>
        </a>
        <a href="assignments.html" class="sidebar-link" data-page="assignments.html">
          <i class="fa-solid fa-list-check"></i><span>Assignments</span>
        </a>
        <a href="timetable.html" class="sidebar-link" data-page="timetable.html">
          <i class="fa-solid fa-table-cells"></i><span>Timetable</span>
        </a>
        <a href="profile.html" class="sidebar-link" data-page="profile.html">
          <i class="fa-solid fa-user"></i><span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Collapse sidebar">
          <i class="fa-solid fa-angles-left"></i>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" data-mobile-overlay></div>

    <div>
      <header class="header">
        <div style="display:flex; align-items:center; gap: var(--space-4);">
          <button class="mobile-menu-btn icon-btn" data-mobile-menu aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-greeting">
            <h1>Timetable</h1>
            <p>Your weekly class schedule.</p>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">
            <i class="fa-solid fa-moon"></i>
          </button>
          <div class="avatar" title="Amay Verma">AV</div>
        </div>
      </header>

      <main class="main-content">

        <!-- DESKTOP: table view -->
        <section class="card">
          <table class="timetable-table" id="timetable-table">
            <!-- header row + body rows injected by timetable.js -->
          </table>
        </section>

        <!-- MOBILE: card-list view (CSS controls which one is visible,
             see responsive.css .timetable-table / .timetable-cards rules) -->
        <div class="timetable-cards" id="timetable-cards"></div>

      </main>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/navigation.js"></script>
  <script src="../js/timetable.js"></script>
</body>
</html>
