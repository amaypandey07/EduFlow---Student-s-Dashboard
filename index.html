<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · EduFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">E</div>
        <span class="sidebar-brand-name">EduFlow</span>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="sidebar-link" data-page="index.html">
          <i class="fa-solid fa-grip"></i><span>Dashboard</span>
        </a>
        <a href="pages/academics.html" class="sidebar-link" data-page="academics.html">
          <i class="fa-solid fa-book-open"></i><span>Academics</span>
        </a>
        <a href="pages/attendance.html" class="sidebar-link" data-page="attendance.html">
          <i class="fa-solid fa-calendar-check"></i><span>Attendance</span>
        </a>
        <a href="pages/assignments.html" class="sidebar-link" data-page="assignments.html">
          <i class="fa-solid fa-list-check"></i><span>Assignments</span>
        </a>
        <a href="pages/timetable.html" class="sidebar-link" data-page="timetable.html">
          <i class="fa-solid fa-table-cells"></i><span>Timetable</span>
        </a>
        <a href="pages/profile.html" class="sidebar-link" data-page="profile.html">
          <i class="fa-solid fa-user"></i><span>Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Collapse sidebar">
          <i class="fa-solid fa-angles-left"></i>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" data-mobile-overlay></div>

    <!-- ============ MAIN ============ -->
    <div>
      <header class="header">
        <div style="display:flex; align-items:center; gap: var(--space-4);">
          <button class="mobile-menu-btn icon-btn" data-mobile-menu aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="header-greeting">
            <h1 id="greeting-text">Good morning, Amay</h1>
            <p id="today-date">Here's your academic overview.</p>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" data-theme-toggle aria-label="Toggle theme">
            <i class="fa-solid fa-moon"></i>
          </button>
          <button class="icon-btn" aria-label="Notifications">
            <i class="fa-solid fa-bell"></i>
            <span class="dot"></span>
          </button>
          <div class="avatar" title="Amay Verma">AV</div>
        </div>
      </header>

      <main class="main-content">
        <!-- Stat cards, attendance ring, academic performance, assignments
             preview, timetable preview, and recent activity are added in
             Commit 3. This commit only establishes the sidebar + header
             shell and confirms navigation/collapse behavior works. -->
        <p style="color: var(--text-secondary);">
          Dashboard content coming in the next commit.
        </p>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/navigation.js"></script>
</body>
</html>
